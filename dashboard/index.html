<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GWS Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Global Warning System</h1>
    </header>
    <div class="container">
        <nav class="sidebar">
            <ul>
                <li><a href="#overview">Overview</a></li>
                <li><a href="#alerts">Alerts</a></li>
                <li><a href="#reports">Reports</a></li>
                <li><a href="#settings">Settings</a></li>
            </ul>
        </nav>
        <main class="main">
            <section id="overview" class="card">
                <h2>Overview</h2>
                <p>Summary of current system status.</p>
            </section>
            <section id="alerts" class="card">
                <h2>Alerts</h2>
                <p>Recent warnings and notifications.</p>
            </section>
            <section id="reports" class="card">
                <h2>Reports</h2>
                <p>Downloadable data and analytics.</p>
            </section>
            <section id="settings" class="card">
                <h2>Settings</h2>
                <p>Configuration options for the dashboard.</p>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
